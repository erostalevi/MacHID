name: Release

# Every push to master that touches code is built and tested. When the signing secrets exist in the
# `release` environment, it is also signed, notarized and published as a GitHub release (CLI zip + app DMG).
# Docs-only and registry-only changes are excluded (the registry has its own workflow, registry.yml).
on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "plugins.json"
      - "Schemas/**"

permissions:
  contents: read

# Queue releases, never cancel one midway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    environment: release   # holds the signing and notarization secrets
    permissions:
      contents: write
    env:
      HAVE_SIGNING_SECRETS: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 != '' && secrets.DEVELOPER_ID_CERT_PASSWORD != '' && secrets.DEVELOPER_ID_IDENTITY != '' && secrets.NOTARY_API_KEY_P8_BASE64 != '' && secrets.NOTARY_API_KEY_ID != '' && secrets.NOTARY_API_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use the newest Xcode on the runner
        # The Liquid Glass UI needs the macOS 26 SDK (Xcode 26+); older toolchains build the material fallback.
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
          swift --version

      - name: Compute version
        id: version
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          echo "version=${base}.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Skip publishing if the tag already exists
        id: guard
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: swift test

      - name: Build release binaries
        run: swift build -c release --arch arm64

      - name: Signing secrets are not configured
        if: env.HAVE_SIGNING_SECRETS != 'true'
        run: echo "::notice::Built and tested only. Add the signing secrets to the 'release' environment to publish a release (see docs/RELEASE.md)."

      - name: Import signing certificate
        if: env.HAVE_SIGNING_SECRETS == 'true' && steps.guard.outputs.exists != 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

      - name: Sign and notarize the CLI
        if: env.HAVE_SIGNING_SECRETS == 'true' && steps.guard.outputs.exists != 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          mkdir -p dist
          cp .build/arm64-apple-macosx/release/machid dist/machid
          codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" dist/machid
          codesign --verify --strict --verbose=2 dist/machid
          (cd dist && ditto -c -k --keepParent machid "machid-${{ steps.version.outputs.version }}-macos-arm64.zip")
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "dist/machid-${{ steps.version.outputs.version }}-macos-arm64.zip" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait
          rm -f "$RUNNER_TEMP/notary.p8"
          rm dist/machid

      - name: Build, sign and notarize the app (DMG)
        if: env.HAVE_SIGNING_SECRETS == 'true' && steps.guard.outputs.exists != 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          version="${{ steps.version.outputs.version }}"
          export REGISTRY_PUBLIC_KEY="${{ vars.REGISTRY_PUBLIC_KEY }}" SPARKLE_PUBLIC_KEY="${{ vars.SPARKLE_PUBLIC_KEY }}"
          # The app's version is the release version; Sparkle compares the build number, which only goes up.
          export APP_VERSION="$version" BUILD_NUMBER="$(git rev-list --count HEAD)"
          OUT="$RUNNER_TEMP/app" BUILD_DIR="$RUNNER_TEMP/app-build" scripts/make-app.sh
          mkdir -p "$RUNNER_TEMP/dmg" dist
          cp -R "$RUNNER_TEMP/app/MacHID.app" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "MacHID" -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO "dist/MacHID-${version}.dmg"
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "dist/MacHID-${version}.dmg"
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "dist/MacHID-${version}.dmg" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait
          rm -f "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "dist/MacHID-${version}.dmg"
          (cd dist && shasum -a 256 *.zip *.dmg > SHA256SUMS)

      - name: Generate the update feed (appcast.xml)
        if: env.HAVE_SIGNING_SECRETS == 'true' && steps.guard.outputs.exists != 'true' && env.SPARKLE_ED_PRIVATE_KEY != ''
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p "$RUNNER_TEMP/appcast"
          cp "dist/MacHID-${version}.dmg" "$RUNNER_TEMP/appcast/"
          key="$RUNNER_TEMP/sparkle-ed.key"
          (umask 077; printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key")
          tool="$(find "$RUNNER_TEMP/app-build/artifacts" -path '*Sparkle/bin/generate_appcast' | head -1)"
          "$tool" --ed-key-file "$key" \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/v${version}/" \
            "$RUNNER_TEMP/appcast"
          rm -f "$key"
          cp "$RUNNER_TEMP/appcast/appcast.xml" dist/appcast.xml

      # The Homebrew cask update is added once a tap repository exists.

      - name: Create GitHub release
        if: env.HAVE_SIGNING_SECRETS == 'true' && steps.guard.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" dist/* \
            --target "${{ github.sha }}" \
            --title "MacHID ${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Remove signing keychain
        if: always() && env.HAVE_SIGNING_SECRETS == 'true'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
