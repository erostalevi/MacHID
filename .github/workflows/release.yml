name: Release

# Every push to master that touches code is built, tested and published as a GitHub release (app DMG + CLI zip).
# The app is NOT notarized (no Apple Developer account): it is ad hoc signed, so the first launch needs
# right-click > Open (or System Settings > Privacy & Security > Open Anyway). Updates afterwards go through Sparkle,
# verified with an EdDSA key, and are not quarantined, so Gatekeeper does not ask again.
# Docs-only and registry-only changes are excluded (the registry has its own workflow, registry.yml).
on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "plugins.json"
      - "Schemas/**"

permissions:
  contents: read

# Queue releases, never cancel one midway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      HAVE_SPARKLE: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Use the newest Xcode on the runner
        # The Liquid Glass UI needs the macOS 26 SDK (Xcode 26+); older toolchains build the material fallback.
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
          swift --version

      - name: Compute version
        id: version
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          echo "version=${base}.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Skip publishing if the tag already exists
        id: guard
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: swift test

      - name: Build the app bundle (ad hoc signed)
        if: steps.guard.outputs.exists != 'true'
        env:
          REGISTRY_PUBLIC_KEY: ${{ vars.REGISTRY_PUBLIC_KEY }}
        run: |
          export APP_VERSION="${{ steps.version.outputs.version }}" BUILD_NUMBER="$(git rev-list --count HEAD)"
          OUT="$RUNNER_TEMP/app" BUILD_DIR="$RUNNER_TEMP/app-build" scripts/make-app.sh

      - name: Package the DMG and the CLI
        if: steps.guard.outputs.exists != 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p "$RUNNER_TEMP/dmg" dist
          cp -R "$RUNNER_TEMP/app/MacHID.app" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "MacHID" -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO "dist/MacHID-${version}.dmg"
          swift build -c release --arch arm64 --product machid
          cp .build/arm64-apple-macosx/release/machid dist/machid
          codesign --force --sign - dist/machid
          (cd dist && ditto -c -k --keepParent machid "machid-${version}-macos-arm64.zip" && rm machid)
          (cd dist && shasum -a 256 *.zip *.dmg > SHA256SUMS)

      - name: Generate the update feed (appcast.xml)
        if: steps.guard.outputs.exists != 'true' && env.HAVE_SPARKLE == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p "$RUNNER_TEMP/appcast"
          cp "dist/MacHID-${version}.dmg" "$RUNNER_TEMP/appcast/"
          key="$RUNNER_TEMP/sparkle-ed.key"
          (umask 077; printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key")
          tool="$(find "$RUNNER_TEMP/app-build/artifacts" -path '*Sparkle/bin/generate_appcast' | head -1)"
          "$tool" --ed-key-file "$key" \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/v${version}/" \
            "$RUNNER_TEMP/appcast"
          rm -f "$key"
          cp "$RUNNER_TEMP/appcast/appcast.xml" dist/appcast.xml

      - name: Updates are not signed
        if: steps.guard.outputs.exists != 'true' && env.HAVE_SPARKLE != 'true'
        run: |
          echo "::warning::SPARKLE_ED_PRIVATE_KEY is not set, so this release has no appcast.xml and installed apps will not see it. See docs/RELEASE.md."

      - name: Create GitHub release
        if: steps.guard.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" dist/* \
            --target "${{ github.sha }}" \
            --title "MacHID ${{ steps.version.outputs.version }}" \
            --notes "Unsigned build (no Apple notarization). First launch: right-click MacHID.app > Open, or System Settings > Privacy & Security > Open Anyway. Later updates install themselves." \
            --generate-notes
