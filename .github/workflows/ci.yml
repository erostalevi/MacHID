name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build the app bundle
        run: OUT="$RUNNER_TEMP/app" BUILD_DIR="$RUNNER_TEMP/app-build" CONFIG=debug scripts/make-app.sh
      - name: Validate bundled definitions
        run: swift run machid-validate definition Definitions/*.json
      - name: Validate plugins.json
        run: swift run machid-validate registry plugins.json

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
